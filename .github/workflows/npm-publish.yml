name: Publish to npm

on:
    release:
        types: [created]
permissions:
    id-token: write # Required for OIDC
    contents: read
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 'lts/*'
                  package-manager-cache: false # never use caching in release builds
            - run: yarn install --frozen-lockfile
            - run: npm publish
